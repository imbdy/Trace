name: Release Trace

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundled backend
        run: |
          python -m pip install --upgrade pip pyinstaller
          powershell -ExecutionPolicy Bypass -File electron/scripts/build-backend.ps1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        working-directory: electron
        run: npm ci
      - name: Build and publish installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win:publish
      - name: Put the release notes on the release page
        # electron-builder ships releaseInfo into latest.yml (auto-update
        # "what's new") but not always into the release page body; the page
        # deserves the same notes, so patch it under the pushed tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" -Headers $headers
          $body = Get-Content RELEASE_NOTES.md -Raw
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) -ContentType "application/json; charset=utf-8" | Out-Null
          Write-Output "Release body set for $env:GITHUB_REF_NAME"
