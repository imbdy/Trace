name: Release Trace

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            publish_cmd: npm run dist:win:publish
          - os: macos-latest
            publish_cmd: npx electron-builder --mac dmg zip --publish always
          - os: ubuntu-latest
            publish_cmd: npx electron-builder --linux AppImage deb --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundled backend
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python electron/scripts/build-backend.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install dependencies
        working-directory: electron
        run: npm ci
      - name: Build and publish installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.publish_cmd }}

  finalize-release-notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Ensure release is published with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          body=$(cat RELEASE_NOTES.md 2>/dev/null || echo "Release ${GITHUB_REF_NAME}")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$body" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "$body"
          fi
        # gh is preinstalled on GitHub runners. RELEASE_NOTES.md may be absent
        # in this checkout state; we fall back to a minimal note.
