<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./character.css" />
<title>Trace</title>
</head>
<body>
<canvas id="face"></canvas>
<div id="panel" class="hidden">
  <textarea id="input" rows="4" spellcheck="false"
    placeholder="Why is this code broken?  Explain this error without changing my code…"></textarea>
  <div id="side">
    <button id="send" type="button">Send</button>
    <button id="cancel" type="button" disabled>Cancel</button>
  </div>
  <div id="hint">Enter to send · Shift+Enter newline · Esc folds panel</div>
</div>
<script src="./character.js"></script>
</body>
</html>
