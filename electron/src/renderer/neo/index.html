<!doctype html>
<!-- Trace command bar: a premium glass debugging console hanging off the top
     edge. Face row on top (always visible), investigation workspace unfolding
     below on demand. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* ws://127.0.0.1:*; font-src 'self'">
<title>Trace</title>
<link rel="icon" type="image/png" sizes="32x32" href="trace-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="trace-16.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="sill">
    <div id="leaf" aria-hidden="false" aria-label="Trace">
      <div id="face-row">
        <div id="hearth-wrap" title="Trace — click to open" role="button" tabindex="0"
          aria-expanded="false" aria-controls="leaf-body" aria-label="Trace — open workspace">
          <canvas id="hearth" width="288" height="288"></canvas>
          <div id="badge" hidden></div>
        </div>
        <div id="face-side">
          <div id="leaf-head">
            <span id="leaf-glow"></span>
            <span id="leaf-title">Trace</span>
          </div>
          <div id="leaf-sub" aria-live="polite">ready to debug</div>
          <div id="talk-row">
            <input id="talk-text" type="text" spellcheck="false" autocomplete="off"
              placeholder="Talk to him — press Enter" aria-label="Talk to Trace">
          </div>
        </div>
        <div id="face-btns">
          <button id="leaf-chat" class="icon-btn" type="button" title="chat with Trace"
            aria-pressed="false" aria-controls="chat" aria-label="Chat with Trace">⌁</button>
          <button id="leaf-settings" class="icon-btn" type="button" title="model connection"
            aria-pressed="false" aria-controls="provider-settings" aria-label="Model connection">⚙</button>
          <button id="leaf-fold" type="button" title="fold the panel (esc)">fold</button>
        </div>
      </div>
      <div id="leaf-body" aria-hidden="true">
        <div id="ask">
          <textarea id="ask-text" rows="2" spellcheck="false"
            placeholder="Describe the bug or paste the error…"></textarea>
          <button id="ask-send" type="button">Investigate</button>
        </div>
        <label id="ask-fix-row" title="Fix the bug in place instead of only explaining it">
          <input id="ask-fix" type="checkbox">
          <span>Fix it for me (write the verified patch, keep a backup)</span>
        </label>
        <div id="ask-mode" role="radiogroup" aria-label="Investigation mode">
          <label class="mode-btn"><input type="radio" name="investigation_type" value="debug" checked> Debug</label>
          <label class="mode-btn"><input type="radio" name="investigation_type" value="explain"> Explain</label>
        </div>
        <div id="live" hidden>
          <div id="live-title-row"><span id="live-title">Investigation</span><span id="live-phase" aria-live="polite">—</span></div>
          <div id="stitch">
            <span class="st" data-s="capture">capture</span><i>→</i>
            <span class="st" data-s="inspect">inspect</span><i>→</i>
            <span class="st" data-s="analyze">analyze</span><i>→</i>
            <span class="st" data-s="verify">verify</span><i>→</i>
            <span class="st" data-s="report">report</span>
          </div>
          <div id="live-log"></div>
          <div id="verdict" hidden>
            <div id="verdict-line" aria-live="polite"></div>
            <button id="verdict-open" type="button">Open results</button>
          </div>
        </div>
        <div id="controls">
          <button id="ctl-cancel" type="button" disabled>Cancel</button>
          <button id="ctl-results" type="button">Results</button>
          <button id="ctl-hide" type="button" title="hide Trace entirely — the tray brings him back">Tuck away</button>
        </div>
      </div>
      <!-- Normal chat lives in HIS window: no second window, no browser tab,
           no separate surface. Bubbles + a composer, run from the chat button. -->
      <div id="chat" hidden aria-hidden="true">
        <div id="chat-scroll">
          <div id="chat-log" role="log" aria-label="Chat with Trace"></div>
        </div>
        <div id="chat-composer">
          <input id="chat-input" type="text" spellcheck="false" autocomplete="off"
            placeholder="Say anything — Enter to send" aria-label="Chat message"
            title="Talk with Trace right here">
          <button id="chat-send" type="button">send</button>
        </div>
      </div>
      <section id="provider-settings" hidden aria-hidden="true" aria-label="Model connection settings">
        <div class="settings-heading"><span>Model connection</span><span id="provider-status">not connected</span></div>
        <p class="settings-copy">Use Ollama locally, or connect any OpenAI-compatible API.</p>
        <div class="settings-grid">
          <label>Provider<select id="provider-kind"><option value="ollama">Ollama</option><option value="openai-compatible">OpenAI-compatible API</option></select></label>
          <label>Model<input id="provider-model" type="text" autocomplete="off" placeholder="gpt-4o-mini"></label>
          <label id="provider-base-row">API base<input id="provider-base" type="url" autocomplete="off" placeholder="https://api.openai.com/v1"></label>
          <label id="provider-key-row">API key<input id="provider-key" type="password" autocomplete="off" placeholder="sk-…"></label>
        </div>
        <div class="settings-actions"><button id="provider-save" type="button">Save connection</button><span id="provider-hint">Keys are used locally by Trace.</span></div>
      </section>
    </div>
  </div>
</div>
<script src="hearthling.js"></script>
<script src="leaf.js"></script>
<script src="shell.js"></script>
<script src="trace.js"></script>
</body>
</html>
