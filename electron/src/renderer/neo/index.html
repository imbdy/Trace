<!doctype html>
<!-- Trace command bar: a premium glass debugging console hanging off the top
     edge. Face row on top (always visible), investigation workspace unfolding
     below on demand. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* ws://127.0.0.1:*; font-src 'self'">
<title>Trace</title>
<link rel="icon" type="image/png" sizes="32x32" href="trace-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="trace-16.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="sill">
    <div id="leaf" aria-hidden="false" aria-label="Trace">
      <div id="face-row">
        <div id="hearth-wrap" title="Trace — click to open" role="button" tabindex="0"
          aria-expanded="false" aria-controls="leaf-body" aria-label="Trace — open workspace">
          <canvas id="hearth" width="288" height="288"></canvas>
          <div id="badge" hidden></div>
        </div>
        <div id="face-side">
          <div id="leaf-head">
            <span id="leaf-glow"></span>
            <span id="leaf-title">Trace</span>
          </div>
          <div id="leaf-sub">ready to debug</div>
        </div>
        <div id="face-btns">
          <button id="leaf-fold" type="button" title="fold the panel (esc)">fold</button>
        </div>
      </div>
      <div id="leaf-body" aria-hidden="true">
        <div id="ask">
          <textarea id="ask-text" rows="2" spellcheck="false"
            placeholder="Describe the bug or paste the error…"></textarea>
          <button id="ask-send" type="button">Investigate</button>
        </div>
        <label id="ask-fix-row" title="Fix the bug in place instead of only explaining it">
          <input id="ask-fix" type="checkbox">
          <span>Fix it for me (write the verified patch, keep a backup)</span>
        </label>
        <div id="ask-mode" role="radiogroup" aria-label="Investigation mode">
          <label class="mode-btn"><input type="radio" name="investigation_type" value="debug" checked> Debug</label>
          <label class="mode-btn"><input type="radio" name="investigation_type" value="explain"> Explain</label>
        </div>
        <div id="live" hidden>
          <div id="live-title-row"><span id="live-title">Investigation</span><span id="live-phase">—</span></div>
          <div id="stitch">
            <span class="st" data-s="capture">capture</span><i>→</i>
            <span class="st" data-s="inspect">inspect</span><i>→</i>
            <span class="st" data-s="analyze">analyze</span><i>→</i>
            <span class="st" data-s="verify">verify</span><i>→</i>
            <span class="st" data-s="report">report</span>
          </div>
          <div id="live-log"></div>
          <div id="verdict" hidden>
            <div id="verdict-line"></div>
            <button id="verdict-open" type="button">Open results</button>
          </div>
        </div>
        <div id="controls">
          <button id="ctl-cancel" type="button" disabled>Cancel</button>
          <button id="ctl-results" type="button">Results</button>
          <button id="ctl-hide" type="button" title="hide Trace entirely — the tray brings him back">Tuck away</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="hearthling.js"></script>
<script src="leaf.js"></script>
<script src="shell.js"></script>
<script src="trace.js"></script>
</body>
</html>
