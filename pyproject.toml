[project]
name = "trace"
version = "0.1.0"
description = "Trace — independent desktop debugging companion backend"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
screenshots = ["mss", "Pillow"]

[project.scripts]
trace-backend = "trace_backend.server:run_server"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trace_backend*", "trace_ui*"]
